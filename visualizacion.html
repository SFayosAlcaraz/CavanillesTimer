<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101714">
  <title>Ritmo — visualización</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{--bg:#101714;--panel:#19221e;--line:#303b35;--text:#f0f2eb;--muted:#9aa69c;--green:#c8f36b;--orange:#ffad70;--mono:'DM Mono',monospace;--display:'Space Grotesk',sans-serif;--sans:'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--sans)}.shell{max-width:1600px;margin:auto;padding:28px 36px 32px}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:21px}.brand{display:flex;align-items:center;gap:13px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--green);color:#162014;display:grid;place-items:center;font-size:22px;font-weight:800}.brandname{font:700 21px var(--display)}.brandname span{color:var(--muted);font-weight:500}.clock{font:12px var(--mono);color:var(--muted)}.heading{display:flex;align-items:end;justify-content:space-between;margin:32px 0 22px}.eyebrow{color:var(--green);font:11px var(--mono);text-transform:uppercase;letter-spacing:1.5px}.heading h1{font:600 31px var(--display);letter-spacing:-1px;margin:7px 0 0}.heading p{margin:6px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;color:var(--text);font:600 13px var(--sans);cursor:pointer}.btn:hover{border-color:#69796e}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{min-height:205px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.card.running{background:linear-gradient(155deg,#202a25,#19221e);border-color:#576b45}.card.done{border-color:#784a42}.card.has-photo{min-height:330px}.display-photo{display:block;width:100px;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}.display-photo[data-has-photo="false"]{display:none}.name{font:600 16px var(--display);color:var(--muted);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font:500 clamp(39px,6vw,76px) var(--mono);letter-spacing:-4px;margin:12px 0 5px;font-variant-numeric:tabular-nums}.status{font:10px var(--mono);text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}.running .status{color:var(--green)}.done .status{color:var(--orange)}footer{display:flex;justify-content:space-between;color:var(--muted);font:11px var(--mono);margin-top:20px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:55px 10px}.offline{color:var(--orange)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.shell{padding:22px}}@media(max-width:700px){.shell{padding:16px 14px 25px}.heading{align-items:start;flex-direction:column;gap:14px;margin-top:25px}.heading h1{font-size:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{min-height:145px;padding:10px}.time{font-size:clamp(29px,8vw,48px);letter-spacing:-2px}.name{font-size:13px}.brandname{font-size:19px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.card{min-height:130px}footer{font-size:9px}}
  </style>
</head>
<body><main class="shell"><header class="topbar"><div class="brand"><div class="brandmark">◷</div><div class="brandname">ritmo <span>/ visualización</span></div></div><span class="clock" id="clock"></span></header><section class="heading"><div><div class="eyebrow">Vista de competición</div><h1>Marcadores en directo</h1><p>Estado y tiempo de todos los equipos.</p></div><div class="actions"><button class="btn" id="fullscreen">⛶ Pantalla completa</button></div></section><section class="grid" id="grid"></section><footer><span>RITMO · COMPETICIÓN EDUCATIVA</span><span id="date"></span></footer></main>
  <script>
    const KEY='ritmo-timers-v1';let timers=[];
    const pad=n=>String(n).padStart(2,'0');
    function read(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved?.timers))timers=saved.timers}catch{}}
    function elapsed(t,now){return Math.max(0,t.elapsed+(t.running&&t.startedAt?Math.floor((now-t.startedAt)/1000):0))}
    function format(n){return `${pad(Math.floor(n/3600))}:${pad(Math.floor(n/60)%60)}:${pad(n%60)}`}
    function render(){read();const now=Date.now();document.getElementById('grid').innerHTML=timers.length?timers.map(t=>{const passed=elapsed(t,now),left=t.mode==='down'?Math.max(0,t.duration-passed):passed,done=t.mode==='down'&&left===0&&passed>=t.duration;return `<article class="card ${t.photo?'has-photo ':''}${t.running?'running':''} ${done?'done':''}"><img class="display-photo" src="${escapeHtml(t.photo||"")}" alt="" data-has-photo="${!!t.photo}"><div class="name">${escapeHtml(t.name)}</div><div class="time">${format(left)}</div><div class="status">${done?'Tiempo finalizado':t.running?'● En marcha':passed?'Ⅱ En pausa':'○ Preparado'}</div></article>`}).join(''):'<div class="empty">Aún no hay contadores. Abre la gestión y configura la competición.</div>';document.getElementById('date').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(now);document.getElementById('clock').textContent=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now)}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};
    window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();setInterval(render,250);
  </script>
</body></html>
